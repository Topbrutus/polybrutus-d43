name: Verify Polybrutus D43 exact certificate and frozen D42 archive
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d43:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Verify 1128 exact labelled distances and stipulated graph
        run: python src/verify_d43.py
      - name: Verify independent Fraction-based labelled metric
        run: python tests/independent_d43.py
      - name: Check deterministic certificate output
        run: git diff --exit-code -- results/certificate_d43.json
      - name: Authenticate complete frozen D42 scientific source and certificate
        run: |
          python -c "from pathlib import Path;from zipfile import ZipFile;import hashlib;p=Path('prior/d42/frozen_scientific_tag_v0.1.0.zip');c=Path('prior/d42/results/certificate_d42.json').read_bytes();assert hashlib.sha256(p.read_bytes()).hexdigest()=='3789f4a185bb50dc0d2aaa157cc370044768598abce2095c3a5e6c80eb8e9f7a';assert hashlib.sha256(c).hexdigest()=='279a43e425687b0359d61f2b104acaf2df926b04bd822f2934fb2f3016fdda20';z=ZipFile(p);assert len(z.namelist())==28 and z.testzip() is None and z.read('results/certificate_d42.json')==c"
